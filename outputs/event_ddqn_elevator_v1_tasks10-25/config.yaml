seed: 42
device: cuda
dataset: elevator_v1
algorithm: ddqn
env:
  split: train
  num_agents: 12
  sample_with_replacement: false
  min_subtasks: 10
  max_subtasks: 25
  system_profile: paper_public_v3
  f_alloc_mode: load_aware
  cloud_share_mode: shared
  cloud_share_factor: 0.5
  cloud_share_floor: 0.1
  heuristic_state_mode: none
  tmax_mode: dataset
  deadline_penalty: 2.0
  d_scale: 1.0e6
  c_scale: 1.0e9
  delta_scale: 1.0e5
model:
  hidden_dim: 256
train:
  total_episodes: 1000
  log_interval: 10
  save_interval: 250
  critic_lr: 0.0003
  gamma: 0.99
  max_grad_norm: 1.0
  batch_size: 256
  buffer_size: 100000
  updates_per_step: 1
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay: 0.995
  target_update_interval: 500
output:
  algorithm_name: event_ddqn_elevator_v1
  root_dir: outputs
  save_best_by: ep_return
