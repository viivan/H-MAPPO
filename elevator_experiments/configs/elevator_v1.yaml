seed: 42
device: cuda
dataset: elevator_v1

env:
  split: train
  num_agents: 12
  sample_with_replacement: false
  min_subtasks: 10
  max_subtasks: 25
  system_profile: paper_public_v3
  f_alloc_mode: load_aware
  cloud_share_mode: shared
  cloud_share_factor: 0.50
  cloud_share_floor: 0.10
  heuristic_state_mode: strong_outcome
  heuristic_mask: false
  tmax_mode: dataset
  deadline_penalty: 2.0
  d_scale: 1.0e6
  c_scale: 1.0e9
  delta_scale: 1.0e5

heuristic:
  type: strong_greedy
  critical_ratio_thresh: 0.7
  slack_thresh: 0.25
  cloud_speedup_thresh: 0.85
  small_compute_ratio: 0.5
  large_data_ratio: 0.8
  local_competitive_ratio: 1.05
  primary_bonus: 1.0
  top_k: 2
  top_k_end: 4
  top_k_decay_episode: 800

model:
  actor_type: action_conditioned
  actor_hidden_dim: 128
  critic_hidden_dim: 128

train:
  total_episodes: 2000
  episodes_per_update: 16
  log_interval: 10
  save_interval: 250
  actor_lr: 0.00025
  critic_lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.04
  entropy_coef_end: 0.005
  entropy_decay_episodes: 2000
  value_coef: 0.5
  max_grad_norm: 1.0
  ppo_epochs: 3
  mini_batch_size: 256

output:
  algorithm_name: event_ppo_heuristic_elevator_v1
  root_dir: outputs
  save_best_by: ep_return
