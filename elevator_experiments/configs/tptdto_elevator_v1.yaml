seed: 42
device: cuda
dataset: elevator_v1

env:
  split: train
  num_agents: 12
  sample_with_replacement: false
  min_subtasks: 10
  max_subtasks: 25
  system_profile: paper_public_v3
  f_alloc_mode: load_aware
  cloud_share_mode: shared
  cloud_share_factor: 0.50
  cloud_share_floor: 0.10
  heuristic_state_mode: none
  heuristic_mask: false
  tmax_mode: dataset
  deadline_penalty: 2.0
  d_scale: 1.0e6
  c_scale: 1.0e9
  delta_scale: 1.0e5

model:
  actor_type: tptdto
  actor_hidden_dim: 128
  critic_hidden_dim: 128
  task_feature_dim: 10
  transformer_heads: 4
  transformer_layers: 2
  transformer_dropout: 0.0

train:
  total_episodes: 2000
  episodes_per_update: 16
  log_interval: 10
  save_interval: 250
  actor_lr: 0.00025
  critic_lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.04
  entropy_coef_end: 0.005
  entropy_decay_episodes: 2000
  value_coef: 0.5
  max_grad_norm: 1.0
  ppo_epochs: 3
  mini_batch_size: 256

output:
  algorithm_name: event_tptdto_elevator_v1
  root_dir: outputs
  save_best_by: ep_return
